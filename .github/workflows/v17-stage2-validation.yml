name: V1.7 Stage 2 Focused Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v17-stage2-validation.yml"
      - "scanner/alpaca_client.py"
      - "scanner/historical_replay.py"
      - "scanner/backtest_engine.py"
      - "tests/test_alpaca_client_asof_v17.py"
      - "tests/test_historical_replay_v17.py"
      - "tests/test_backtest_engine_v17.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-stage2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run Stage 2 data-adapter, replay, and frozen Stage 1 tests
        run: |
          python -m pytest -q \
            tests/test_alpaca_client_asof_v17.py \
            tests/test_historical_replay_v17.py \
            tests/test_backtest_engine_v17.py
